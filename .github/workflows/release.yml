name: Release

on:
  push:
    tags:
      - "v[0-9][0-9].[0-9][0-9].[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: codexbar-x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: codexbar-aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: bash contrib/ci-install-deps.sh

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/codexbar" "dist/${{ matrix.asset }}"
          tar -C dist -czf "${{ matrix.asset }}-${{ github.ref_name }}.tar.gz" "${{ matrix.asset }}"
          sha256sum "${{ matrix.asset }}-${{ github.ref_name }}.tar.gz" \
            > "${{ matrix.asset }}-${{ github.ref_name }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}-${{ github.ref_name }}.tar.gz
            ${{ matrix.asset }}-${{ github.ref_name }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**

[package]
name = "codexbar"
version = "26.7.0"
edition = "2021"
license = "MIT"
description = "System tray usage monitor for AI coding providers (Linux port of CodexBar)"

[dependencies]
anyhow = "1.0.103"
async-channel = "2.5.0"
async-trait = "0.1.89"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
gtk4 = "0.11.4"
gtk4-layer-shell = "0.8.0"
ksni = "0.3.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
resvg = { version = "0.47.0", default-features = false, features = ["text"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
clap = { version = "4.5.51", features = ["derive"] }
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
